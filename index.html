<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Refuge Hot Potato Timer</title>

  <!-- Inline favicon so no /favicon.ico 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%92%A3%3C/text%3E%3C/svg%3E">

  <style>
    /* =========================
       CUSTOM FONT
       FIX: Font file is in REPO ROOT
       File name: Brianne_s_hand.ttf
       Font family name inside file: Brianne's hand
       ========================= */
    @font-face {
      font-family: "Brianne's hand";
      src: url("briannes-hand.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    :root { color-scheme: dark; }

    body{
      margin:0;
      height:100vh;
      display:grid;
      place-items:center;
      font-family:"Brianne's hand", system-ui, Arial, sans-serif;
      color:#f0f0f0;

      background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        url("background.jpg") center/cover no-repeat fixed,
        #0f0f0f;
    }

    /* Top-left menu (force next song) */
    .topLeftMenu{
      position: fixed;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(20,20,20,0.70);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      box-shadow: 0 16px 28px rgba(0,0,0,0.35);
      user-select: none;
      z-index: 10;
    }

    .topLeftMenu label{
      font-size: 14px;
      letter-spacing: 0.6px;
      opacity: 0.95;
      white-space: nowrap;
    }

    .topLeftMenu select{
      font-family: inherit;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.35);
      color: #f0f0f0;
      outline: none;
      cursor: pointer;
    }

    .card{
      background: rgba(20,20,20,0.75);
      border-radius:16px;
      padding:28px;
      min-width:360px;
      text-align:center;
      border:1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      box-shadow:0 20px 40px rgba(0,0,0,0.5);
    }

    h1{
      margin:0 0 10px;
      letter-spacing:2px;
      text-transform: uppercase;
    }

    /* Timer hidden on purpose */
    #time{ display:none; }

    #status, #nowPlaying{
      font-size:15px;
      margin-top:8px;
      letter-spacing:0.6px;
    }

    .controls{ margin-top:14px; }

    button{
      margin:8px;
      padding:12px 18px;
      font-size:16px;
      border-radius:12px;
      border:none;
      cursor:pointer;
      font-family: inherit;
    }

    button:disabled{ opacity:0.5; cursor:not-allowed; }

    .hint{
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.75;
      letter-spacing: 0.4px;
      line-height: 1.2;
    }
  </style>
</head>

<body>
  <!-- Top-left menu (force next song) -->
  <div class="topLeftMenu">
    <label for="nextSongSelect">Next song:</label>
    <select id="nextSongSelect">
      <option value="random" selected>Random (normal)</option>
      <option value="0">Pandemonium</option>
      <option value="1">Mole Patrol</option>
      <option value="2">Magni &amp; Modi</option>
      <option value="3">Nemesis Pursuit</option>
      <option value="4">Mushroom Gorge</option>
      <option value="5">Toad&#39;s Factory</option>
      <option value="6">Moonview Highway</option>
    </select>
  </div>

  <div class="card">
    <h1>Hot Potato</h1>

    <div id="status">Awaiting activation.</div>
    <div id="time">--</div>
    <div id="nowPlaying">Now playing: none</div>

    <div class="controls">
      <button id="startBtn">Start (10–40s)</button>
      <button id="stopBtn" disabled>Abort</button>
    </div>

    <div class="hint">
      Random music will not repeat until all 7 have been played.<br>
      If a file is missing, check the browser Console for a 404.
    </div>

    <!-- Audio -->
    <audio id="boom" src="boom.mp3" preload="auto"></audio>
    <audio id="click" src="click.mp3" preload="auto"></audio>
    <audio id="music" preload="auto"></audio>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const timeEl = document.getElementById("time"); // hidden, internal only
    const nowPlayingEl = document.getElementById("nowPlaying");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const nextSongSelect = document.getElementById("nextSongSelect");

    const boomAudio = document.getElementById("boom");
    const clickAudio = document.getElementById("click");
    const musicAudio = document.getElementById("music");

    const songs = [
      { file: "song1.mp3", name: "Pandemonium" },
      { file: "song2.mp3", name: "Mole Patrol" },
      { file: "song3.mp3", name: "Magni & Modi" },
      { file: "song4.mp3", name: "Nemesis Pursuit" },
      { file: "song5.mp3", name: "Mushroom Gorge" },
      { file: "song6.mp3", name: "Toad's Factory" },
      { file: "song7.mp3", name: "Moonview Highway" }
    ];

    let timerId = null;
    let remaining = 0;

    // Shuffle-bag: all songs once before any repeats
    let bag = [];

    function refillBag() {
      bag = Array.from({ length: songs.length }, (_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
    }

    function getNextRandomFromBag() {
      if (bag.length === 0) refillBag();
      return bag.pop();
    }

    function randomSeconds(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function setUI(running) {
      startBtn.disabled = running;
      stopBtn.disabled = !running;
    }

    function stopMusic() {
      musicAudio.pause();
      musicAudio.currentTime = 0;
      musicAudio.removeAttribute("src");
      musicAudio.load();
      nowPlayingEl.textContent = "Now playing: none";
    }

    // Useful error messages if files are missing
    musicAudio.addEventListener("error", () => {
      statusEl.textContent = "Music failed to load (404?). Check that song1.mp3...song7.mp3 exist with exact names.";
    });
    boomAudio.addEventListener("error", () => {
      statusEl.textContent = "boom.mp3 failed to load (404?). Check file name.";
    });
    clickAudio.addEventListener("error", () => {
      statusEl.textContent = "click.mp3 failed to load (404?). Check file name.";
    });

    async function startMusic() {
      const forced = nextSongSelect.value;

      let idx;
      if (forced !== "random") {
        idx = Number(forced);
        // Forced song does NOT affect bag tracking
        nextSongSelect.value = "random";
      } else {
        idx = getNextRandomFromBag();
      }

      const song = songs[idx];

      // Force load + play
      musicAudio.pause();
      musicAudio.currentTime = 0;
      musicAudio.src = song.file;
      musicAudio.loop = true;
      musicAudio.load();

      nowPlayingEl.textContent = `Now playing: ${song.name}`;

      try {
        await musicAudio.play();
      } catch (e) {
        statusEl.textContent = "Audio blocked by browser. Try clicking Start again (or interact once with the page).";
        console.error("music play() failed:", e);
      }
    }

    async function playBoom() {
      boomAudio.currentTime = 0;
      try { await boomAudio.play(); }
      catch (e) { console.error("boom play() failed:", e); }
    }

    async function playClick() {
      clickAudio.currentTime = 0;
      try { await clickAudio.play(); }
      catch (e) { console.error("click play() failed:", e); }
    }

    async function stopTimer() {
      await playClick();

      if (timerId) clearInterval(timerId);
      timerId = null;
      remaining = 0;

      stopMusic();
      setUI(false);
      statusEl.textContent = "Sequence aborted.";
      timeEl.textContent = "--";
    }

    async function startTimer() {
      remaining = randomSeconds(10, 40);
      timeEl.textContent = remaining;

      statusEl.textContent = "Detonation sequence armed.";
      setUI(true);

      await startMusic();

      if (timerId) clearInterval(timerId);

      timerId = setInterval(async () => {
        remaining--;
        timeEl.textContent = remaining;

        if (remaining <= 0) {
          clearInterval(timerId);
          timerId = null;

          stopMusic();
          setUI(false);

          statusEl.textContent = "💥 Detonation complete.";
          await playBoom();
        }
      }, 1000);
    }

    // Start randomized immediately
    refillBag();

    startBtn.addEventListener("click", startTimer);
    stopBtn.addEventListener("click", stopTimer);
  </script>
</body>
</html>
