<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Refuge Hot Potato Timer</title>

  <style>
    /* =========================
       CUSTOM FONT
       ========================= */
    @font-face {
      font-family: "Brianne's hand";
      src: url("fonts/Brianne_s_hand.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    :root { color-scheme: dark; }

    body{
      margin:0;
      height:100vh;
      display:grid;
      place-items:center;
      font-family:"Brianne's hand", system-ui, Arial, sans-serif;
      color:#f0f0f0;

      background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        url("background.jpg") center/cover no-repeat fixed,
        #0f0f0f;
    }

    /* Top-left menu */
    .topLeftMenu{
      position: fixed;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(20,20,20,0.70);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      box-shadow: 0 16px 28px rgba(0,0,0,0.35);
      user-select: none;
    }

    .topLeftMenu label{
      font-size: 14px;
      letter-spacing: 0.6px;
      opacity: 0.95;
      white-space: nowrap;
    }

    .topLeftMenu select{
      font-family: inherit;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.35);
      color: #f0f0f0;
      outline: none;
      cursor: pointer;
    }

    .card{
      background: rgba(20,20,20,0.75);
      border-radius:16px;
      padding:28px;
      min-width:360px;
      text-align:center;
      border:1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      box-shadow:0 20px 40px rgba(0,0,0,0.5);
    }

    h1{
      margin:0 0 10px;
      letter-spacing:2px;
      text-transform: uppercase;
    }

    /* Timer hidden on purpose */
    #time{ display:none; }

    #status, #nowPlaying{
      font-size:15px;
      margin-top:8px;
      letter-spacing:0.6px;
    }

    .controls{ margin-top:14px; }

    button{
      margin:8px;
      padding:12px 18px;
      font-size:16px;
      border-radius:12px;
      border:none;
      cursor:pointer;
      font-family: inherit;
    }

    button:disabled{ opacity:0.5; cursor:not-allowed; }

    .hint{
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.75;
      letter-spacing: 0.4px;
    }
  </style>
</head>

<body>
  <!-- Top-left menu (force next song) -->
  <div class="topLeftMenu">
    <label for="nextSongSelect">Next song:</label>
    <select id="nextSongSelect">
      <option value="random" selected>Random (normal)</option>
      <option value="0">Pandemonium</option>
      <option value="1">Mole Patrol</option>
      <option value="2">Magni &amp; Modi</option>
      <option value="3">Nemesis Pursuit</option>
      <option value="4">Mushroom Gorge</option>
      <option value="5">Toad&#39;s Factory</option>
      <option value="6">Moonview Highway</option>
    </select>
  </div>

  <div class="card">
    <h1>Hot Potato</h1>

    <div id="status">Awaiting activation.</div>
    <div id="time">--</div>
    <div id="nowPlaying">Now playing: none</div>

    <div class="controls">
      <button id="startBtn">Start (10–40s)</button>
      <button id="stopBtn" disabled>Abort</button>
    </div>

    <div class="hint">
      Random music will not repeat until all 7 have been played.
    </div>

    <!-- Audio -->
    <audio id="boom" src="boom.mp3" preload="auto"></audio>
    <audio id="click" src="click.mp3" preload="auto"></audio>
    <audio id="music" preload="auto"></audio>
  </div>
